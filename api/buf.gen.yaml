version: v2
inputs:
  - directory: .
    exclude_paths:
      - google
plugins:
  - local: protoc-gen-go
    out: ../pkg/api
    opt:
      - paths=source_relative
  - local: protoc-gen-go-grpc
    out: ../pkg/api
    opt:
      - paths=source_relative
  - local: protoc-gen-grpc-gateway
    out: ../pkg/api
    opt:
      - paths=source_relative
