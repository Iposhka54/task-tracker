name: TaskFlow CI/CD Pipeline
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [ main ]

env:
  GO_VERSION: '1.22'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: taskflow

jobs:
  test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      - name: Test
        run: |
          go test -v ./...
          go test -race ./...